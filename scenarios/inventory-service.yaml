apiVersion: v1
kind: Namespace
metadata:
  name: application-lab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventory-data
  namespace: application-lab
  labels:
    app: inventory-service
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: application-lab
  labels:
    app: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
        component: backend
    spec:
      containers:
        - name: app
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              echo "inventory service started"
              if ! echo "active" > /data/state.txt; then
                echo "ERROR: unable to persist application state" >&2
                exit 17
              fi
              sleep 3600
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 32Mi
          volumeMounts:
            - name: inventory-data
              mountPath: /data
              readOnly: true
      volumes:
        - name: inventory-data
          persistentVolumeClaim:
            claimName: inventory-data
            readOnly: true
