apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-sync
  namespace: incident-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-sync
  template:
    metadata:
      labels:
        app: inventory-sync
    spec:
      containers:
        - name: worker
          image: incident-inventory-sync:v1
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
