apiVersion: v1
kind: Namespace
metadata:
  name: validation-beta
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: worker-data-pv
spec:
  capacity:
    storage: 64Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: worker-local
  hostPath:
    path: /tmp/worker-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worker-data
  namespace: validation-beta
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: worker-local
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: validation-beta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      containers:
        - name: worker
          image: worker-service:1.0
          imagePullPolicy: Never
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: worker-data
