apiVersion: v1
kind: Namespace
metadata:
  name: business-apps
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orders-data
  namespace: business-apps
  labels:
    app: orders-api
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: business-apps
spec:
  selector:
    app: orders-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: business-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              mkdir -p /www
              echo 'orders service ready' > /www/index.html
              echo 'orders API serving HTTP on port 8080'
              exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: 9090
            initialDelaySeconds: 8
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: orders-data
              mountPath: /var/lib/orders
              readOnly: false
      volumes:
        - name: orders-data
          persistentVolumeClaim:
            claimName: orders-data
