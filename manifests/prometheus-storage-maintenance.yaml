apiVersion: v1
kind: Pod
metadata:
  name: prometheus-storage-maintenance
  namespace: monitoring
spec:
  restartPolicy: Never
  containers:
    - name: maintenance
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - sleep 7200
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: prometheus-server
