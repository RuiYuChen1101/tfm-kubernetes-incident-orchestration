apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensre
  namespace: opensre
  labels:
    app: opensre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensre
  template:
    metadata:
      labels:
        app: opensre
    spec:
      containers:
        - name: opensre
          image: opensre-custom:0.1.2026.8.10-timeout2h-k8sfix4
          imagePullPolicy: Never
          env:
            - name: MODE
              value: web
            - name: PORT
              value: "8000"
          envFrom:
            - configMapRef:
                name: opensre-config
            - secretRef:
                name: opensre-auth
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
