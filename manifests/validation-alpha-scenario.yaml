apiVersion: v1
kind: Namespace
metadata:
  name: validation-alpha
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: validation-alpha
  labels:
    app: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: app
          image: service-runtime:1.0
          imagePullPolicy: IfNotPresent
          args: ["1"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 64Mi
